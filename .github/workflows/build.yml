name: Build
on: push

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1

      - name: Build
        run: gradle build

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Tool Miner build
          prerelease: true
          files: build/libs/*.jar
